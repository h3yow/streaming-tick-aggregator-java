server.port=0

# ===== 行情聚合配置（AggregatorProperties）=====
# 窗口长度（毫秒），默认 1 分钟
aggregator.window-size-ms=60000
# 允许乱序延迟（毫秒）：watermark = 已观测最大事件时间 - allowedLatenessMs
aggregator.allowed-lateness-ms=10000
# 每个标的保留的已关闭窗口数量上限（超出按最老裁剪，保证内存有界）
aggregator.retained-closed-windows=1000
# 每个标的保留的超时迟到事件归类记录上限
aggregator.max-late-records-per-symbol=1000

# 测试日志：打印事件输入与判定依据（见 TickIngestionService / AggregationQueryService 日志）
logging.level.com.github.h3yow.streamingtickaggregatorjava=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} -- %msg%n
